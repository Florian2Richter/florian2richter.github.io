project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "about.qmd"
    - "posts/**/*.qmd"
    # Figure partials are included into the posts, never pages of
    # their own; keep them out of the render (and the listing).
    - "!posts/**/figures/**"

website:
  draft-mode: unlinked
  title: "Florian's Blog"
  description: "Notes on quantum information, Clifford channels, and the corners of math that make them tick."
  site-url: "https://florian2richter.github.io"
  repo-url: "https://github.com/Florian2Richter/florian2richter.github.io"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    background: dark
    left:
      - href: index.qmd
        text: Blog
      - href: about.qmd
        text: About
    right:
      - icon: github
        href: "https://github.com/Florian2Richter"
        aria-label: GitHub
      - icon: envelope
        href: "mailto:florian2richter@gmail.com"
        aria-label: Email
  page-footer:
    center: "© 2026 Florian Richter"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: false
    html-math-method: katex
    fig-cap-location: bottom
    link-external-newwindow: true
