<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="The eight nonzero labels of the plane F_3^2 on a ring, stepped around a single cycle by the matrix h. The mirror pair (1,0) and (2,0), where lambda vanishes, sits at opposite ends of a dashed diameter, splitting the ring into two arcs of four steps each.">
  <defs>
    <marker id="arrowOcA" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#233746"/></marker>
    <marker id="arrowOcT" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6f8f"/></marker>
  </defs>
  <circle cx="280" cy="190" r="130" fill="none" stroke="#829aa6" stroke-width="1" stroke-opacity="0.18"/>

  <!-- mirror diameter: advancing half the cycle is multiplication by -1 -->
  <line x1="170.00" y1="190.00" x2="390.00" y2="190.00" stroke="#7d8a91" stroke-width="1.2" stroke-dasharray="3,4" stroke-opacity="0.6"/>
  <text x="280.00" y="180.00" text-anchor="middle" font-size="13" fill="#7d8a91" font-style="italic">&#951; &#8614; &#8722;&#951;</text>

  <!-- the grand cycle of h: upper arc, then lower arc -->
  <path d="M 150.97 174.16 A 130 130 0 0 1 177.56 109.96" fill="none" stroke="#233746" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcA)"/>
  <path d="M 199.96 87.56 A 130 130 0 0 1 264.16 60.97" fill="none" stroke="#233746" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcA)"/>
  <path d="M 295.84 60.97 A 130 130 0 0 1 360.04 87.56" fill="none" stroke="#233746" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcA)"/>
  <path d="M 382.44 109.96 A 130 130 0 0 1 409.03 174.16" fill="none" stroke="#233746" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcA)"/>
  <path d="M 409.03 205.84 A 130 130 0 0 1 382.44 270.04" fill="none" stroke="#2d6f8f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcT)"/>
  <path d="M 360.04 292.44 A 130 130 0 0 1 295.84 319.03" fill="none" stroke="#2d6f8f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcT)"/>
  <path d="M 264.16 319.03 A 130 130 0 0 1 199.96 292.44" fill="none" stroke="#2d6f8f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcT)"/>
  <path d="M 177.56 270.04 A 130 130 0 0 1 150.97 205.84" fill="none" stroke="#2d6f8f" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowOcT)"/>
  <text x="339.70" y="50.87" text-anchor="middle" font-size="18" fill="#233746" font-style="italic">h</text>

  <!-- the eight labels -->
  <circle cx="150.00" cy="190.00" r="12.5" fill="none" stroke="#c25b4e" stroke-width="1.6" stroke-opacity="0.55"/>
  <circle cx="150.00" cy="190.00" r="7" fill="#c25b4e"/>
  <text x="124.00" y="195.00" text-anchor="end" font-size="14" fill="#c25b4e">(1,0)</text>
  <circle cx="188.08" cy="98.08" r="7" fill="#233746"/>
  <text x="169.69" y="84.69" text-anchor="end" font-size="14" fill="#233746">(0,1)</text>
  <circle cx="280.00" cy="60.00" r="7" fill="#233746"/>
  <text x="280.00" y="39.00" text-anchor="middle" font-size="14" fill="#233746">(1,2)</text>
  <circle cx="371.92" cy="98.08" r="7" fill="#233746"/>
  <text x="390.31" y="84.69" text-anchor="start" font-size="14" fill="#233746">(2,2)</text>
  <circle cx="410.00" cy="190.00" r="12.5" fill="none" stroke="#c25b4e" stroke-width="1.6" stroke-opacity="0.55"/>
  <circle cx="410.00" cy="190.00" r="7" fill="#c25b4e"/>
  <text x="436.00" y="195.00" text-anchor="start" font-size="14" fill="#c25b4e">(2,0)</text>
  <circle cx="371.92" cy="281.92" r="7" fill="#233746"/>
  <text x="390.31" y="305.31" text-anchor="start" font-size="14" fill="#233746">(0,2)</text>
  <circle cx="280.00" cy="320.00" r="7" fill="#233746"/>
  <text x="280.00" y="351.00" text-anchor="middle" font-size="14" fill="#233746">(2,1)</text>
  <circle cx="188.08" cy="281.92" r="7" fill="#233746"/>
  <text x="169.69" y="305.31" text-anchor="end" font-size="14" fill="#233746">(1,1)</text>
  <text x="124.00" y="217.00" text-anchor="end" font-size="13" fill="#c25b4e" font-style="italic">&#955; = 0</text>
  <text x="436.00" y="217.00" text-anchor="start" font-size="13" fill="#c25b4e" font-style="italic">&#955; = 0</text>
  <text x="280.00" y="385.00" text-anchor="middle" font-size="15" fill="#233746" font-style="italic">the grand cycle of h on the labels, d = 3</text>
</svg>
